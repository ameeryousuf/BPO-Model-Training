name: sapsam

channels:
  - conda-forge

dependencies:
  - python=3.11

  # PYTHON AND JUPYTER BASICS
  - pip
  - ipython
  - ipykernel
  - tqdm
  - joblib
  - jupyterlab
  - notebook
  - nbformat
  - nbclient
  - nbconvert-core

  # DATA SCIENCE BASICS
  - pandas
  - numpy=1.26.4
  - matplotlib
  - seaborn
  - scipy
  - pyarrow

  # NLP (upstream SAP-SAM language detection)
  - spacy
  - wordcloud
  - stringcase

  # PROJECT INSTALLATION + ML STACK (BPR pipeline: notebooks 5-7)
  - pip:
      - -e .
      - spacy_langdetect
      - language_data

      # -- torch: installed from the PyTorch CUDA 12.9 wheel index, not conda-forge/PyPI default.
      # If installing fresh, run this first (pip alone will pull CPU-only torch otherwise):
      #   pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu129
      - torch==2.8.0+cu129
      - torchvision==0.23.0+cu129
      - torchaudio==2.8.0+cu129

      # Hugging Face fine-tuning stack (notebooks 6 and 7)
      - transformers==5.14.1
      - peft==0.20.0
      - accelerate==1.14.0
      - datasets==5.0.1
      - tokenizers==0.22.2
      - safetensors==0.8.0
      - huggingface-hub==1.26.0

      # Evaluation metrics (notebook 6)
      - scikit-learn==1.9.0
